<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Catalog</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 40px auto; padding: 0 16px; }
    #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; }
    .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; }
    .tag { font-size: 12px; color: #666; text-transform: uppercase; }
    .price { font-weight: 700; }
  </style>
</head>
<body>
  <h1>My Product Catalog</h1>
  <div id="list">Loading...</div>
  <script src="config.js"></script>
  <script>
    fetch(`${API_BASE}/products`)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(items => {
        document.getElementById("list").innerHTML = items.map(p => `
          <div class="card">
            <img src="${p.image_url}" alt="${p.name}">
            <div class="tag">${p.category}</div>
            <h3>${p.name}</h3>
            <p>${p.description}</p>
            <div class="price">$${p.price.toFixed(2)}</div>
          </div>`).join("");
      })
      .catch(e => { document.getElementById("list").textContent = "Failed to load: " + e; });
  </script>
</body>
</html>
